token: "You write the SEO meta description for a page on [site:name].\n\nPage title: [node:title]\nPage content: [node:field_content]\n\nWrite one meta description that tells a searcher what this page gives them.\n\nRules:\n- Between 140 and 155 characters. Never longer than 160.\n- One or two plain sentences. No quotation marks, no markdown, no emoji, no list.\n- Do not repeat the page title word for word.\n- Do not invent facts, names, numbers or dates that are not in the content above.\n- Do not use \"Learn more\", \"Click here\", \"In this article\" or similar filler.\n- Write in the language the page content is written in.\n\nReturn only the meta description, nothing else."
